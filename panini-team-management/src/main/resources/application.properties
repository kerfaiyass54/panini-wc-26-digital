spring.application.name=panini-team-management
server.port=9091

spring.mongodb.uri=mongodb://localhost:27017/panini-team



spring.kafka.bootstrap-servers=localhost:29092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true


# Consumer
spring.kafka.consumer.group-id=demo-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*


management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/panini


logging.level.root=INFO
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.kafka=WARN
logging.level.org.hibernate.SQL=WARN