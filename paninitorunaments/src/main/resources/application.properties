spring.application.name=paninitorunaments
# =========================================
# APPLICATION
# =========================================
# =========================================
# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5445/panini_tournament
spring.datasource.username=alibou
spring.datasource.password=alibou
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================
# KAFKA
# =========================================
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.group-id=panini-tournament
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Trust packages for JSON deserialization
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Optional
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# =========================================
# LOGGING
# =========================================
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.apache.kafka=INFO

app.kafka.match-request-topic=match-request-topic
app.kafka.match-result-topic=match-result-topic